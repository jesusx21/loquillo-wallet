[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["domain", "database", "fixtures", "run_script", "mister_krabz", "app", "api", "tests", "migrations"]
known_test = ["unittest", "unittest.mock", "pytest", "nose2", "mock", "tests", "assertpy"]
sections = ["STDLIB", "THIRDPARTY", "FIRSTPARTY", "TEST", "LOCALFOLDER"]
combine_as_imports = true
force_sort_within_sections = true
